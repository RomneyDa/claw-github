name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve Release Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag_name="${{ inputs.tag_name }}"
          else
            tag_name="${GITHUB_REF_NAME}"
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Build Extension Zip
        run: |
          ./build.sh
          mkdir -p "$RUNNER_TEMP/release"
          cd dist
          zip -r "$RUNNER_TEMP/release/claw-github-extension.zip" .

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
        run: |
          extension_asset="$RUNNER_TEMP/release/claw-github-extension.zip"
          userscript_asset="claw-github.user.js"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$extension_asset" "$userscript_asset" --clobber
          else
            gh release create "$TAG_NAME" "$extension_asset" "$userscript_asset" \
              --target "$GITHUB_SHA" \
              --title "$TAG_NAME" \
              --notes "Chrome extension and userscript builds for $TAG_NAME."
          fi
